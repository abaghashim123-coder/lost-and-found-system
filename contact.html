</head>
<body>
    <nav>
        <div class="logo">نظام المفقودات</div>
        <ul>
            <li><a href="about.html">عن الموقع</a></li>
            <li><a href="services.html">خدماتنا</a></li>

        </ul>
    </nav>
    <div class="container">
        <h1>تواصل معنا</h1>
        <p>إذا واجهتك أي مشكلة أو وجدت غرضاً وتريد إبلاغنا، يسعدنا تواصلك معنا عبر النموذج أدناه:</p>
        <form id="contactForm">
            <label for="name">الاسم الكامل:</label>
            <input type="text" id="name" required placeholder="أدخل اسمك">

            <label for="msg-email">البريد الإلكتروني:</label>
            <input type="email" id="msg-email" required placeholder="أدخل بريدك">

            <label for="message">الرسالة:</label>
            <textarea id="message" rows="4" required placeholder="اكتب رسالتك هنا..."></textarea>

            <button type="submit">إرسال الرسالة</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
